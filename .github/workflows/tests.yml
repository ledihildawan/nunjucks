name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    # WHY: hard wall-clock bound — without it a wedged runner burns GitHub's 360-minute default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - bun: 1.0
            os: windows-2022
          - bun: 1.0
            os: windows-2025
          - bun: 1.0
            os: ubuntu-22.04
          - bun: 1.1
            os: ubuntu-22.04
          - bun: 1.1
            os: macos-14
          - bun: latest
            os: ubuntu-latest
          - bun: latest
            os: macos-latest

    name: Test (bun-${{ matrix.bun }}/${{ matrix.os }})

    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false && git config --global core.eol lf
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install
      - run: bun test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build

  coverage:
    runs-on: ubuntu-latest
    # WHY: informational visibility — no thresholds yet; failures surface as test failures, not coverage deltas.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test --coverage

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# WHY: superseded pushes/PR-updates on the same ref cancel stale runs instead of
# burning matrix minutes on commits nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    # WHY: hard wall-clock bound — without it a wedged runner burns GitHub's 360-minute default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - bun: 1.0
            os: windows-2022
          - bun: 1.0
            os: windows-2025
          - bun: 1.0
            os: ubuntu-22.04
          - bun: 1.1
            os: ubuntu-22.04
          - bun: 1.1
            os: macos-14
          - bun: latest
            os: ubuntu-latest
          - bun: latest
            os: macos-latest

    name: Test (bun-${{ matrix.bun }}/${{ matrix.os }})

    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false && git config --global core.eol lf
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install
      # WHY: --timeout 5000 mirrors `npm test` — a wedged test fails in 5s instead of
      # burning the job's full 15-minute wall.
      - run: bun test --timeout 5000

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      # WHY: format gate — biome format exits non-zero when any file would change,
      # keeping the one-time format sweep (this commit) from drifting back.
      - run: bun run format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build

  coverage:
    runs-on: ubuntu-latest
    # WHY: coverage gate — line coverage floor at 95% (measured baseline 96.7% leaves
    # headroom for platform variance; bun's --coverage accepts no thresholds, so the
    # gate script parses the "All files" summary).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      # WHY: pipefail — without it `tee`'s exit 0 can mask a failing test suite, leaving
      # only the coverage number to fail the job; --timeout 5000 mirrors `npm test`.
      - run: set -o pipefail && bun test --coverage --timeout 5000 | tee coverage.txt
      - run: bash scripts/coverage-gate.sh 95
